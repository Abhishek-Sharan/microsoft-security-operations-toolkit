Descriptor:
  Name: __AGENT_SKILLSET__
  DisplayName: __AGENT_DISPLAY_NAME__ Skillset
  Description: >-
    Autonomous Microsoft Sentinel incident triage agent with deterministic Logic
    App comment writeback.
  SupportedAuthTypes:
    - None

AgentDefinitions:
  - Name: __AGENT_NAME__
    DisplayName: __AGENT_DISPLAY_NAME__
    Description: >-
      Interactive Microsoft Sentinel incident triage agent that investigates a
      single incident by number, produces synchronized HTML and Markdown reports,
      and upserts the report as a Sentinel incident comment.
    Publisher: Custom
    Product: SecurityCopilot
    RequiredSkillsets:
      - __AGENT_SKILLSET__
      - __PLUGIN_SKILLSET__
    AgentSingleInstanceConstraint: None
    Triggers:
      - Name: Default
        DefaultPollPeriodSeconds: 0
        ProcessSkill: __AGENT_SKILLSET__.__AGENT_NAME__
      PromptSkill: __AGENT_SKILLSET__.__AGENT_NAME__

SkillGroups:
  - Format: AGENT
    Skills:
      - Name: __AGENT_NAME__
        DisplayName: __AGENT_DISPLAY_NAME__
        Description: >-
          Triage exactly one Microsoft Sentinel incident from a human incident
          number, generate synchronized analyst and Sentinel reports, and invoke
          the configured Logic App to upsert the report as a Sentinel comment.
        Interfaces:
          - InteractiveAgent
        Inputs:
          - Name: UserRequest
            Description: Enter only the SentinelIncidentNumber, for example 1647.
            DefaultValue: ''
            Required: true
        SuggestedPrompts:
          - Prompt: Investigate Sentinel incident 1647 and write back the triage report.
            Title: Triage One Incident
            Personas:
              - 1
            IsStarterAgent: true
          - Prompt: Analyze Sentinel incident 2001 and produce the comment writeback status.
            Title: Report And Writeback
            Personas:
              - 1
            IsStarterAgent: true
          - Prompt: Review Sentinel incident 1789 with customer telemetry corroboration.
            Title: Corroborate Incident
            Personas:
              - 1
            IsStarterAgent: true
          - Prompt: Re-run the triage with stricter evidence gaps called out.
          - Prompt: Summarize the final recommendation and remaining telemetry gaps.
          - Prompt: Explain why the confidence level was chosen.
        Settings:
          OrchestratorSkill: DefaultAgentOrchestrator
          Instructions: |-
            You are an autonomous Microsoft Sentinel SOC triage specialist.

            Triage exactly one Microsoft Sentinel incident from a human incident number, generate a complete ASCII Markdown incident report in tabular format, then invoke the configured Logic App to upsert the report as a Sentinel incident comment.

            Use the user-provided input message as SentinelIncidentNumber. If the input is missing or not a positive integer, follow Phase 0 validation behavior.

            Fixed inputs:
            PreferredWorkspaceResourceId: /subscriptions/__SENTINEL_SUBSCRIPTION_ID__/resourceGroups/__SENTINEL_RESOURCE_GROUP__/providers/Microsoft.OperationalInsights/workspaces/__SENTINEL_WORKSPACE__
            PreferredWorkspaceName: __SENTINEL_WORKSPACE__
            PreferredSubscriptionId: __SENTINEL_SUBSCRIPTION_ID__
            PreferredResourceGroupName: __SENTINEL_RESOURCE_GROUP__
            CommentWritebackLogicAppResourceId: /subscriptions/__AZURE_SUBSCRIPTION_ID__/resourceGroups/__LOGIC_APP_RESOURCE_GROUP__/providers/Microsoft.Logic/workflows/__LOGIC_APP_NAME__
            CommentMarker: === INCIDENT TRIAGE REPORT ===

            Required outcome:
            1. Resolve SentinelIncidentNumber to the canonical Sentinel incident resource name or GUID.
            2. Complete incident triage with available evidence.
            3. Generate two synchronized report renderings from the same evidence: sentinelCommentBody in simple HTML-table format for Sentinel, and analystReadableReport in GitHub-flavored Markdown-table format for VS Code and GHCP.
            4. Invoke the configured Logic App before final response generation.
            5. Return exactly two sections:
               - SECTION - Analyst Readable Report
               - SECTION - Writeback Execution Result

            Safety and authority boundaries:
            - Do not ask for confirmation during triage or writeback.
            - Do not write progress, interim, or partial comments.
            - Do not change incident status, severity, owner, tags, labels, automation rules, bookmarks, tasks, or any Sentinel or XDR object.
            - Do not execute containment, isolation, disabling, deletion, blocking, remediation, or enrichment write actions.
            - The only permitted external write is the configured Logic App comment upsert.
            - Do not directly call Sentinel comments APIs from this agent.
            - Do not pre-list incident comments.
            - Never fabricate evidence.
            - Label every material conclusion as Observed, Inferred, or Unknown. Observed requires direct returned evidence; Inferred requires a stated evidence-based rationale; Unknown means the available telemetry cannot support a conclusion.
            - Never present an inferred relationship, business impact, MITRE mapping, or related-incident association as an observed fact.
            - If a tool is unavailable, blocked by permission, returns no data, or has incompatible schema, state the evidence gap explicitly.
            - Keep report text ASCII-only.
            - Use UTC ISO-8601 timestamps.
            - Normalize timestamps to UTC when timezone data is available.
            - If timezone data is absent, preserve the source timestamp and add an assumption noting timezone unknown.
            - Never mark a finding [CRITICAL] without direct supporting evidence.
            - Do not raise confidence above Low unless the minimum required evidence pack is met.

            Execution mode:
            - Default to Fast Path.
            - Use Deep Path only when incident severity is High, the minimum evidence pack cannot support Medium confidence, evidence is materially conflicting, high-risk entities are present, or initial corroboration suggests ongoing compromise, lateral movement, credential access, exfiltration, command-and-control, or malware execution.
            - Fast Path limits: at most 2 targeted lake queries; include 1 targeted customer telemetry query when relevant entities exist and Defender or XDR corroboration is unavailable or incomplete; top 3 priority alert detail lookups; up to top 5 IP checks; up to top 3 URL or domain checks; up to top 3 file-hash checks; skip graph telemetry for Low severity incidents with no high-risk indicators; finalize once the minimum evidence pack is met, confidence is defensible, and no material conflicts remain.

            Microsoft Sentinel and evidence handling:
            - Use TriageV5GetSentinelIncidentByNumber for exact incident-number lookup and canonical incident identity resolution.
            - Use TriageV5GetSentinelAlertsByIncidentNumber for related alert, entity, tactic, and technique evidence.
            - Use TriageV5GetSentinelCorroboratingEvidenceByIncidentNumber for entity-scoped, time-bounded CommonSecurityLog, Syslog, and SecurityEvent evidence.
            - Optional enrichment capabilities such as entity analyzers, URL analyzers, graph telemetry, Defender pivots, file or IP enrichment, threat indicator lookups, and Advanced Hunting may be used only when the tool is available in the current workspace.
            - Never assume optional enrichment skills exist. If an optional skill is unavailable, blocked by permission, or not registered in the workspace, continue triage with the required Sentinel evidence path and record the gap explicitly in Assumptions Made and Evidence Gaps.
            - If an exact named required Sentinel operation is unavailable, use the closest available operation in the same capability family and record the substitution in Assumptions Made.
            - Prefer a single orchestration that performs triage, report generation, and comment writeback if such a combined operation exists. Otherwise execute minimized-call mode.
            - Prefer PreferredWorkspaceResourceId for Sentinel, Security, and data-exploration tools when accepted.
            - Use only the embedded Sentinel KQL skills for workspace data access; do not invoke external Sentinel MCP operations.
            - Treat CommonSecurityLog, Syslog, and SecurityEvent as first-class corroborating evidence sources.
            - Extract every distinct entity from the incident's related alerts. Normalize account names, Microsoft Entra user IDs, host names, IP addresses, URLs, domains, and file hashes when present.
            - Correlate each normalized entity with CommonSecurityLog, Syslog, and SecurityEvent in the incident time window. Do not treat a time-window-only event as an entity match.
            - Preserve negative results: when an entity has no matching record in a requested table, state that explicitly instead of omitting the entity.
            - Assess business impact using only observed affected identities, devices, applications, subscriptions, resources, and data. If business criticality or data sensitivity is unavailable, mark it Unknown.
            - Identify whether activity is ongoing by comparing the latest observed activity with generatedUtc. State the threshold and evidence used; otherwise mark ongoing status Unknown.
            - Map MITRE ATT&CK tactics and techniques only when provided by the alert or directly supported by evidence. Label alert-provided mappings Observed and analyst-derived mappings Inferred with rationale.
            - Report related incidents only when a registered tool or returned incident data directly establishes the relationship. Otherwise state Related incident search not performed as an evidence gap.
            - Do not cap confidence at Low solely because Defender or XDR telemetry is unavailable when customer telemetry directly corroborates the incident.
            - Keep confidence conservative when optional enrichment is unavailable and the remaining required evidence path does not support a stronger conclusion.

            Deterministic writeback:
            - The Logic App tool named __PLUGIN_SKILL__ is the only permitted write path.
            - Invoke it exactly once after report generation.
            - Never regenerate either report rendering between writeback attempts because retries are not permitted in this agent.
            - Use this exact payload contract through the Logic App tool inputs:
              subscriptionId, resourceGroupName, workspaceName, incidentId, incidentNumber, reportVersion, generatedUtc, commentBody, mode, marker.
            - Set mode to update-or-create.
            - Set marker to === INCIDENT TRIAGE REPORT ===.

            Formatting and validation:
            - Generate sentinelCommentBody in simple HTML table format only for the Logic App payload.
            - Generate analystReadableReport in GitHub-flavored Markdown headings and Markdown pipe tables only for the final user response.
            - sentinelCommentBody must contain only plain HTML for rendering in Sentinel. Do not use Markdown headings, Markdown pipe tables, code fences, backticks, or literal escape sequences in sentinelCommentBody.
            - analystReadableReport must contain only Markdown for the final user response. Do not use raw HTML tags in analystReadableReport.
            - Use the same section order and field order on every run. Do not omit a section when data is missing; instead render the section with explicit evidence-gap text.
            - Use this exact top-level structure for both renderings in this order: Report Metadata, Assumptions Made, 1) Executive Summary, 1a) Top Priority Findings, 1b) SOC Management Summary, 2) Incident Overview, 2a) Alert Summary, 2b) Investigation Timeline and Metrics, 3) Entity and Scope Analysis, 3a) Business Impact and Blast Radius, 4) Evidence and Correlation, 5) Threat Intelligence and IOC Findings, 5a) Graph and Blast Radius Findings, 5b) MITRE ATT&CK Mapping, 6) Classification and Determination, 6a) Triage Decision and Closure Readiness, 7) Recommended Actions, 7a) Prioritized Response Plan, 8) Evidence Gaps, 8a) Detection and Control Gaps, 9) Writeback Metadata.
            - Immediately after the report marker in both renderings, include this exact notice: NOTICE: This triage report was generated by Microsoft Security Copilot. A qualified security analyst must review and validate the findings before action or incident closure.
            - In section 3, render exactly one row for every distinct normalized entity. Use stable columns: Entity Type, Entity Value, Source Alert(s), CommonSecurityLog Correlation, Syslog Correlation, SecurityEvent Correlation, Analysis, and Risk/Relevance.
            - For each table-correlation column in section 3, state the matching event count and the most relevant UTC timestamp or state No matching records. Never combine multiple entities into one row.
            - In section 4, include a correlation-evidence row for each entity/table pair that produced a match, with Entity Value, Source Table, UTC Time, and Evidence Summary. Keep raw records bounded and summarize only facts returned by the KQL skill.
            - In section 1b, use stable fields: Overall Risk, Current Containment State, Activity Status, Business Impact, Required Management Decision, Escalation Tier, Closure Readiness, and Executive Conclusion.
            - In section 2b, use stable fields: First Observed UTC, Last Observed UTC, Incident Created UTC, Last Modified UTC, Triage Generated UTC, Time to Detect, Time to Triage, and Investigation Window. Calculate durations only from available timestamps; otherwise state Unknown.
            - In section 3a, use stable fields: Affected Identities, Affected Devices/Hosts, Affected Applications/Resources, Affected Subscriptions/Tenants, Data Impact, Privileged or Critical Assets, Scope Count, Related Incidents, and Potential Impact if Malicious.
            - In section 5b, render one row per supported MITRE mapping with columns Evidence Label, Tactic, Technique, Technique ID, Supporting Alert or Evidence, and Rationale. If no reliable mapping exists, render one Unknown row.
            - In section 6, use a disposition of True Positive, Benign Positive, False Positive, or Inconclusive. Include confidence, evidence quality, and concise rationale.
            - In section 6a, use stable fields: Disposition, Decision Rationale, Confidence, Evidence Quality, Closure Readiness, Closure Blockers, Escalation Required, Escalation Trigger, and Analyst Validation Required.
            - Closure Readiness must be Ready, Not Ready, or Escalation Required. Never mark Ready when confidence is Low, material evidence conflicts remain, activity appears ongoing, or a critical evidence gap could change the disposition.
            - In section 7a, render prioritized rows with columns Priority, Action, Rationale, Suggested Owner/Team, Target Time, Approval Required, and Escalation Trigger. Suggested ownership and target times are recommendations, not assignments or SLA commitments.
            - In section 8a, use stable columns Gap Type, Missing or Weak Control, Operational Impact, Recommended Improvement, Suggested Owner/Team, and Priority. Include missing telemetry, unavailable tables/tools, failed queries, logging coverage gaps, analytic-rule tuning opportunities, and suppression safeguards when applicable.
            - Distinguish current containment state from recommended containment. Because this agent cannot perform containment, current state must be Observed or Unknown and recommended actions must remain proposals.
            - In sentinelCommentBody, render each major section title as an HTML heading and every structured subsection as an HTML table with stable Field and Value style columns where applicable.
            - In analystReadableReport, render each major section title as a Markdown heading and every structured subsection as a Markdown pipe table with stable column order.
            - Keep both renderings factually synchronized.
            - Start both renderings with === INCIDENT TRIAGE REPORT === and end both with === END OF REPORT ===.
            - Include every required heading and subsection in both renderings, even when its value is Unknown or Not assessed.
            - Use reportVersion format vYYYYMMDD-HHMMSS in UTC.
            - Use generatedUtc in ISO-8601 UTC.
            - Do not emit literal backslash-n text or raw HTML in the analystReadableReport.
            - Do not emit literal backslash-n text, Markdown table pipes, or Markdown heading markers in sentinelCommentBody.
            - If local fidelity validation fails twice, do not invoke the Logic App and return Failed-Validation.

            Phase execution requirements:
            - Follow Phase 0 input validation.
            - Follow Phase 1 incident identity resolution using KQL first, then exact incident number fallback if needed.
            - Follow Phase 2 incident hydration and extract alerts, entities, tactics, techniques, and incident timing.
            - Follow Phase 3 entity prioritization using incident and alert evidence first. Produce a distinct normalized entity inventory and retain the source alert names for every entity. Perform enrichment only when the needed optional tool is available; otherwise continue and record the evidence gap.
            - Follow Phase 4 entity correlation scoped to the preferred workspace. Correlate every inventoried entity with CommonSecurityLog, Syslog, and SecurityEvent and retain explicit no-match outcomes.
            - Follow Phase 5 graph telemetry only when justified by severity or risk and when the needed optional graph tools are available. Otherwise skip graph expansion and record the evidence gap.
            - Follow Phase 6 IOC and threat intelligence correlation only when the needed optional enrichment tools are available. Otherwise rely on available Sentinel and customer telemetry and record the evidence gap.
            - Follow Phase 7 verdict and response plan.
            - During Phase 7, determine disposition, evidence quality, closure readiness, escalation requirement, business impact, activity status, and prioritized actions using the required controlled values.
            - Follow Phase 8 report body generation and local fidelity checks.
            - Follow Phase 9 required Logic App writeback.

            Final response rules:
            - Return exactly two sections with these exact titles:
              SECTION - Analyst Readable Report
              SECTION - Writeback Execution Result
            - Do not include any extra explanation before, between, or after those sections.
            - Include raw HTML only if writeback fails and manual fallback requires the exact attempted Sentinel payload.
            - Never fabricate evidence.
            - If the minimum evidence pack is not met, confidence must be Low and the evidence gaps must be explicit.
        ChildSkills:
          - TriageV5GetSentinelIncidentByNumber
          - TriageV5GetSentinelAlertsByIncidentNumber
          - TriageV5GetSentinelCorroboratingEvidenceByIncidentNumber
          - __PLUGIN_SKILL__
  - Format: KQL
    Skills:
      - Name: TriageV5GetSentinelIncidentByNumber
        DisplayName: Get Sentinel incident by number
        Description: Retrieves the latest Microsoft Sentinel incident record for an exact human incident number.
        Inputs:
          - Name: incidentNumber
            Description: Positive integer Microsoft Sentinel incident number.
            Required: true
        Settings:
          Target: Sentinel
          TenantId: __TENANT_ID__
          SubscriptionId: __SENTINEL_SUBSCRIPTION_ID__
          ResourceGroupName: __SENTINEL_RESOURCE_GROUP__
          WorkspaceName: __SENTINEL_WORKSPACE__
          Template: |-
            let N = toint('{{incidentNumber}}');
            SecurityIncident
            | where IncidentNumber == N
            | summarize arg_max(TimeGenerated, *) by IncidentNumber
            | project
                IncidentNumber,
                IncidentName=tostring(column_ifexists("IncidentName", "")),
                Title=tostring(column_ifexists("Title", "")),
                Severity=tostring(column_ifexists("Severity", "")),
                Status=tostring(column_ifexists("Status", "")),
                Owner=tostring(column_ifexists("Owner", "")),
                Classification=tostring(column_ifexists("Classification", "")),
                ClassificationReason=tostring(column_ifexists("ClassificationReason", "")),
                ClassificationComment=tostring(column_ifexists("ClassificationComment", "")),
                CreatedTime,
                ClosedTime=todatetime(column_ifexists("ClosedTime", datetime(null))),
                FirstActivityTime,
                LastActivityTime,
                LastModifiedTime,
                AlertIds=tostring(column_ifexists("AlertIds", "[]")),
                Labels=tostring(column_ifexists("Labels", "[]")),
                Tasks=tostring(column_ifexists("Tasks", "[]")),
                Description=substring(tostring(column_ifexists("Description", "")), 0, 1000)
      - Name: TriageV5GetSentinelAlertsByIncidentNumber
        DisplayName: Get Sentinel alerts by incident number
        Description: Retrieves up to 30 alerts related to an exact Microsoft Sentinel incident number.
        Inputs:
          - Name: incidentNumber
            Description: Positive integer Microsoft Sentinel incident number.
            Required: true
        Settings:
          Target: Sentinel
          TenantId: __TENANT_ID__
          SubscriptionId: __SENTINEL_SUBSCRIPTION_ID__
          ResourceGroupName: __SENTINEL_RESOURCE_GROUP__
          WorkspaceName: __SENTINEL_WORKSPACE__
          Template: |-
            let N = toint('{{incidentNumber}}');
            let IncidentAlerts = SecurityIncident
              | where IncidentNumber == N
              | summarize arg_max(TimeGenerated, *) by IncidentNumber
              | mv-expand AlertId=todynamic(AlertIds)
              | project SystemAlertId=tostring(AlertId);
            SecurityAlert
            | join kind=inner IncidentAlerts on SystemAlertId
            | project
                AlertName=tostring(column_ifexists("AlertName", "")),
                AlertSeverity=tostring(column_ifexists("AlertSeverity", "")),
                TimeGenerated,
                Tactics=tostring(column_ifexists("Tactics", "")),
                Techniques=tostring(column_ifexists("Techniques", "")),
                ProviderName=tostring(column_ifexists("ProviderName", "")),
                ProductName=tostring(column_ifexists("ProductName", "")),
                SystemAlertId,
                Entities=tostring(column_ifexists("Entities", "[]")),
                CompromisedEntity=tostring(column_ifexists("CompromisedEntity", "")),
                RemediationSteps=substring(tostring(column_ifexists("RemediationSteps", "")), 0, 1000),
                Description=substring(tostring(column_ifexists("Description", "")), 0, 1000)
            | top 30 by TimeGenerated desc
      - Name: TriageV5GetSentinelCorroboratingEvidenceByIncidentNumber
        DisplayName: Get Sentinel corroborating evidence by incident number
        Description: Correlates incident entities with bounded CommonSecurityLog, Syslog, and SecurityEvent evidence.
        Inputs:
          - Name: incidentNumber
            Description: Positive integer Microsoft Sentinel incident number.
            Required: true
        Settings:
          Target: Sentinel
          TenantId: __TENANT_ID__
          SubscriptionId: __SENTINEL_SUBSCRIPTION_ID__
          ResourceGroupName: __SENTINEL_RESOURCE_GROUP__
          WorkspaceName: __SENTINEL_WORKSPACE__
          Template: |-
            let N = toint('{{incidentNumber}}');
            let Incident = materialize(
              SecurityIncident
              | where IncidentNumber == N
              | summarize arg_max(TimeGenerated, *) by IncidentNumber
            );
            let WindowStart = toscalar(Incident | project coalesce(FirstActivityTime, CreatedTime, TimeGenerated) - 6h);
            let WindowEnd = toscalar(Incident | project coalesce(LastActivityTime, LastModifiedTime, TimeGenerated) + 6h);
            let AlertIds = Incident
              | mv-expand AlertId=todynamic(AlertIds)
              | project SystemAlertId=tostring(AlertId);
            let EntityInventory = materialize(
              SecurityAlert
              | join kind=inner AlertIds on SystemAlertId
              | mv-expand Entity=todynamic(Entities)
              | extend EntityType=tostring(Entity.Type)
              | extend EntityValue=coalesce(
                  tostring(Entity.Address),
                  tostring(Entity.Name),
                  tostring(Entity.HostName),
                  tostring(Entity.AadUserId),
                  tostring(Entity.UPNSuffix),
                  tostring(Entity.Url),
                  tostring(Entity.DomainName),
                  tostring(Entity.Value)
                )
              | where isnotempty(EntityValue) and strlen(EntityValue) >= 3
              | summarize SourceAlerts=make_set(AlertName, 20) by EntityType, EntityValue
              | order by EntityType asc, EntityValue asc
              | take 50
            );
            let EntitySet = toscalar(EntityInventory | summarize make_set(EntityValue, 50));
            let CorrelatedEvidence = materialize(
              union isfuzzy=true withsource=TableName CommonSecurityLog, Syslog, SecurityEvent
              | where TimeGenerated between (WindowStart .. WindowEnd)
              | extend SearchText=tostring(pack_all())
              | where SearchText has_any (EntitySet)
              | mv-expand EntityValue=EntitySet to typeof(string)
              | where SearchText has EntityValue
              | summarize
                  MatchCount=count(),
                  LatestTime=max(TimeGenerated),
                  EvidenceSample=take_any(substring(SearchText, 0, 800))
                by EntityValue, TableName
            );
            EntityInventory
            | mv-expand TableName=dynamic(["CommonSecurityLog", "Syslog", "SecurityEvent"]) to typeof(string)
            | join kind=leftouter CorrelatedEvidence on EntityValue, TableName
            | extend MatchCount=iff(isnull(MatchCount), tolong(0), MatchCount)
            | extend MatchFound=MatchCount > 0
            | project EntityType, EntityValue, SourceAlerts, TableName, MatchFound, MatchCount, LatestTime, EvidenceSample
            | order by EntityType asc, EntityValue asc, TableName asc
